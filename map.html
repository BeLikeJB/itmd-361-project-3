<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>MTCC Map</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <style>
      #map {
        height: 420px;
        width: 90%;
        max-width: 900px;
        margin: 20px auto;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <ul>
          <li><a href="index.html">index.html</a></li>
          <li><a href="resume.html">resume.html</a></li>
          <li><a href="page3.html">page3.html</a></li>
          <li><a href="map.html">map.html</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>McCormick Tribune Campus Center (MTCC)</h1>
      <p>Click to view details about MTCC.</p>
      <div id="map"></div>
      <button type="button" id="questions-btn">Questions</button>
    </main>

    <script>
      function initMap() {
        const mtccLocation = { lat: 41.8364, lng: -87.6274 };

        
        const map = new google.maps.Map(document.getElementById("map"), {
          center: mtccLocation,
          zoom: 16,
          mapTypeControl: true
        });

        
        const marker = new google.maps.Marker({
          position: mtccLocation,
          map: map,
          title: "McCormick Tribune Campus Center (MTCC)"
        });

        
        const infoWindow = new google.maps.InfoWindow({
          content: "<h2>McCormick Tribune Campus Center</h2><p>3201 S State St, Chicago, IL — Illinois Tech Campus Hub</p>"
        });

        marker.addListener("click", function () {
          infoWindow.open(map, marker);
        });
      }
    </script>
    <script async src="https://maps.googleapis.com/maps/api/js?key=AlzaSyBM1F-BpX660SBK3-Vw9O9f7AEVTAIH8rl&callback=initMap"></script>
  </body>
</html>
